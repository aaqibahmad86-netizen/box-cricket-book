<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Box Cricket Booking</title>

  <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

  <div class="top">
    <h1>🏏 BOX CRICKET</h1>
    <p>Book Your Slot Instantly</p>
  </div>

  <div class="card">

    <label>Select Date</label>

    <input type="date" id="bookingDate">

    <h3>Available Slots</h3>

    <div class="slots">

      <button class="slot">5 PM - 6 PM</button>
      <button class="slot">6 PM - 7 PM</button>
      <button class="slot">7 PM - 8 PM</button>
      <button class="slot">8 PM - 9 PM</button>
      <button class="slot">9 PM - 10 PM</button>
       <button class="slot">10 PM - 11 PM</button>
       <button class="slot">11 PM - 12 PM</button>
       <button class="slot">12 PM - 01 AM</button>

    </div>

    <input type="text" id="mobile" placeholder="Enter Mobile Number">

    <h3>Scan & Pay</h3>

    <img src="qr.png" class="qr">
<label>Upload Payment Screenshot</label>

<input type="file"
id="paymentScreenshot"
accept="image/*">
    <button id="bookBtn">
      I Have Paid & Book Slot
    </button>

    <p id="message"></p>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
const firebaseConfig = {
  apiKey: "AIzaSyDfudyf6A2o_zQYERCyBXeLlziAfQaDYf4",
  authDomain: "box-cricket-book.firebaseapp.com",
  projectId: "box-cricket-book",
  storageBucket: "box-cricket-book.firebasestorage.app",
  messagingSenderId: "730324891796",
  appId: "1:730324891796:web:b76d512955b3fcfa639c81"

};
const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const storage = getStorage(app);

window.db = db;

window.addDoc = addDoc;

window.collection = collection;

window.getDocs = getDocs;

window.storage = storage;

window.ref = ref;

window.uploadBytes = uploadBytes;

window.getDownloadURL = getDownloadURL;



</script>

<script src="script.js"></script>

</body>
</html>
